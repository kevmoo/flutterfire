name: firebase_messaging_web
description: The web implementation of firebase_messaging
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_messaging/firebase_messaging_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_messaging/firebase_messaging_web
version: 4.1.4
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  firebase_core: ^3.10.1
  firebase_core_web: ^3.5.1
  firebase_messaging_platform_interface: ^4.5.41
  meta: ^1.18.0
  web: ^1.1.1

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseMessagingWebRegistration
        fileName: firebase_messaging_web_registration.dart
