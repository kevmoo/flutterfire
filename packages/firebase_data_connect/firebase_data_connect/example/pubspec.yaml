name: firebase_data_connect_example
resolution: workspace
description: 'Firebase Data Connect example app'

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  google_sign_in: ^6.1.0
  firebase_auth: any
  firebase_data_connect:
    path: ../

  cupertino_icons: ^1.0.6
  flutter_rating_bar: ^4.0.1
  protobuf: any
  firebase_app_check: any

dev_dependencies:
  build_runner: ^2.3.3

  flutter_test:
    sdk: flutter

  flutter_lints: any
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
