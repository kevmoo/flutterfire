name: firebase_data_connect_example
description: 'Firebase Data Connect example app'

publish_to: 'none'

version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.6.0
  google_sign_in: ^6.2.0
  firebase_auth: ^6.3.0
  firebase_data_connect:
    path: ../

  cupertino_icons: ^1.0.6
  flutter_rating_bar: ^4.0.1
  protobuf: ^6.0.0
  firebase_app_check: ^0.4.2

dev_dependencies:
  build_runner: ^2.10.5

  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
