name: firebase_data_connect
resolution: workspace
description: 'Flutter plugin for Firebase Data Connect, a relational database service that lets you build and scale using a fully-managed PostgreSQL database powered by Cloud SQL.'
version: 0.2.4
homepage: https://firebase.google.com/docs/data-connect/quickstart?platform=flutter
false_secrets:
  - example/**
  - dartpad/**

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  crypto: ^3.0.6
  firebase_app_check: any
  firebase_auth: any
  firebase_core: any
  firebase_core_platform_interface: any
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  grpc: any
  http: ^1.2.1
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.0.0
  protobuf: any
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.40

dev_dependencies:
  build_runner: ^2.4.12
  firebase_app_check_platform_interface: any
  firebase_auth_platform_interface: any
  flutter_lints: any
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0
  plugin_platform_interface: ^2.1.3
