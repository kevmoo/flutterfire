name: firebase_core_web
description: The web implementation of firebase_core
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_core/firebase_core_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_core/firebase_core_web
version: 3.5.1
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  firebase_core_platform_interface: ^6.0.3
  meta: ^1.18.0
  web: ^1.1.1

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseCoreWebRegistration
        fileName: firebase_core_web_registration.dart
