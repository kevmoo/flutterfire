name: firebase_app_installations_web
description: The web implementation of firebase_app_installations
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_app_installations/firebase_app_installations_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_app_installations/firebase_app_installations_web
version: 0.1.7+4
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  firebase_app_installations_platform_interface: ^0.1.20
  firebase_core: ^3.10.1
  firebase_core_web: ^3.5.1
  meta: ^1.18.0
  web: ^1.1.1

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseAppInstallationsWebRegistration
        fileName: firebase_app_installations_web_registration.dart
