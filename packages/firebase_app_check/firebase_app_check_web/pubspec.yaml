name: firebase_app_check_web
resolution: workspace
description: The web implementation of firebase_app_check
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_app_check/firebase_app_check_web
version: 0.2.3

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  _flutterfire_internals: any
  firebase_app_check_platform_interface: any
  firebase_core: any
  firebase_core_web: any
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0

dev_dependencies:
  build_runner: ^2.3.3
  firebase_core_platform_interface: any
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseAppCheckWeb
        fileName: firebase_app_check_web.dart
