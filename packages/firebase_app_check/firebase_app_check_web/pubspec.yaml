name: firebase_app_check_web
description: The web implementation of firebase_app_check
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_app_check/firebase_app_check_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_app_check/firebase_app_check_web
version: 0.2.3
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  firebase_app_check_platform_interface: ^0.2.22
  firebase_core: ^3.10.1
  firebase_core_web: ^3.5.1
  meta: ^1.18.0

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseAppCheckWebRegistration
        fileName: firebase_app_check_web_registration.dart
