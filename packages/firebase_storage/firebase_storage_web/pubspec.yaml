name: firebase_storage_web
description: The web implementation of firebase_storage
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_storage/firebase_storage_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_storage/firebase_storage_web
version: 3.11.4
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  firebase_core: ^3.10.1
  firebase_core_web: ^3.5.1
  firebase_storage_platform_interface: ^5.1.21
  meta: ^1.18.0

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseStorageWebRegistration
        fileName: firebase_storage_web_registration.dart
