name: firebase_auth_web
description: The web implementation of firebase_auth
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_auth/firebase_auth_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_auth/firebase_auth_web
version: 6.1.4
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  firebase_auth_platform_interface: ^7.4.9
  firebase_core: ^3.10.1
  firebase_core_web: ^3.5.1
  meta: ^1.18.0
  web: ^1.1.1

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_test:
    sdk: flutter
  mockito: ^5.6.3

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseAuthWebRegistration
        fileName: firebase_auth_web_registration.dart
