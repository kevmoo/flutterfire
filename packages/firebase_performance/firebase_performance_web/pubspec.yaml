name: firebase_performance_web
description: The web implementation of firebase_performance
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_performance/firebase_performance_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_performance/firebase_performance_web
version: 0.1.8+4
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  firebase_core: ^3.10.1
  firebase_core_web: ^3.5.1
  firebase_performance_platform_interface: ^0.1.22
  meta: ^1.18.0

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebasePerformanceWebRegistration
        fileName: firebase_performance_web_registration.dart
