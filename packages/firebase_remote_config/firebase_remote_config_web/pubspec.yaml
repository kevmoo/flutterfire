name: firebase_remote_config_web
description: The web implementation of firebase_remote_config
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_remote_config/firebase_remote_config_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_remote_config/firebase_remote_config_web
version: 1.10.5
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  firebase_core: ^3.10.1
  firebase_core_web: ^3.5.1
  firebase_remote_config_platform_interface: ^1.5.9
  meta: ^1.18.0
  web: ^1.1.1

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseRemoteConfigWebRegistration
        fileName: firebase_remote_config_web_registration.dart
