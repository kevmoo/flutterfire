name: firebase_database_web
resolution: workspace
description: The web implementation of firebase_database
version: 0.2.7+5
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_database/firebase_database_web

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  collection: ^1.18.0
  firebase_core: any
  firebase_core_web: any
  firebase_database_platform_interface: any
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  firebase_core_platform_interface: any
  flutter_test:
    sdk: flutter
  flutter_lints: any


flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseDatabaseWeb
        fileName: firebase_database_web.dart
