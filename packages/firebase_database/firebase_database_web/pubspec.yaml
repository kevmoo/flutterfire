name: firebase_database_web
description: The web implementation of firebase_database
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_database/firebase_database_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_database/firebase_database_web
version: 0.2.7+5
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  collection: ^1.19.1
  firebase_core: ^3.10.1
  firebase_core_web: ^3.5.1
  firebase_database_platform_interface: ^0.2.33
  meta: ^1.18.0

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseDatabaseWebRegistration
        fileName: firebase_database_web_registration.dart
